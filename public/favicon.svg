<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B1E"/>
      <stop offset="100%" stop-color="#0E1C42"/>
    </linearGradient>
    <linearGradient id="peakCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#B8C5FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6B7AFF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="peakLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="peakRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  
  <!-- Glowing Crystal Peaks -->
  <g filter="url(#glow)" stroke="#A5B4FC" stroke-width="1.2" stroke-linejoin="round">
    <!-- Left Mountain -->
    <polygon points="20,68 38,36 52,68" fill="url(#peakLeft)" />
    <line x1="38" y1="36" x2="38" y2="68" stroke="#C7D2FE" stroke-width="1"/>
    
    <!-- Right Mountain -->
    <polygon points="48,68 64,40 80,68" fill="url(#peakRight)" />
    <line x1="64" y1="40" x2="64" y2="68" stroke="#E9D5FF" stroke-width="1"/>
    
    <!-- Central Main Mountain (Tallest) -->
    <polygon points="32,68 50,18 68,68" fill="url(#peakCenter)" />
    <line x1="50" y1="18" x2="50" y2="68" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="32" y1="68" x2="68" y2="68" stroke="#C7D2FE" stroke-width="1.5"/>
  </g>
</svg>
