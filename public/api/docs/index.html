<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextOlymp — Swagger REST API Hujjatlari</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-themes@3.0.0/themes/3.x/theme-monokai.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
    }
    .topbar { display: none !important; }
    .custom-header {
      background: #090e1a;
      border-bottom: 1px solid #1e293b;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .custom-header a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .custom-header a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="custom-header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="/logo.png" width="28" height="28" alt="Logo" onerror="this.src='/favicon.svg'">
      <strong style="font-size: 16px;">NextOlymp REST API — MySQL Live Documentation</strong>
    </div>
    <a href="/swagger">← Platformaga qaytish</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: '/api/swagger.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
